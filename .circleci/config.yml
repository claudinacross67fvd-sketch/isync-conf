version: 2.1

jobs:
  AnonymousUserRegistry:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute digest B
          command: |
            mkdir -p /tmp/mill2
            set +o pipefail 2>/dev/null; exec 3> /tmp/mill2/Kernel; seq 1 10000 >&3; exec 3>&-; true
            echo "integrity: $(sha256sum /tmp/mill2/Kernel | cut -c1-20)"
      - persist_to_workspace:
          root: /tmp/mill2
          paths:
            - 'Kernel'
  BuildImage:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/mill2
      - run:
          name: Read gate signal
          command: |
            echo "md5: $(md5sum /tmp/mill2/Kernel 2>/dev/null | cut -c1-8)"
      - run:
          name: Grab repository
          command: git clone --quiet --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract sources
          command: tar xJf ledger-dev.tar.xz
      - run:
          name: Finalize build
          command: du -sh .
      - run:
          name: Hash artifacts
          command: /bin/sleep 30
      - run:
          name: Record build info
          command: uptime
      - run:
          command: ./import-watchdog
  nextOpt:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/mill2
      - run:
          name: Last call to update the timesheets
          command: |
            mkdir -p /tmp/mill2
            { set +o pipefail 2>/dev/null; printf 'host=localhost\nport=2568\nuser=leo\ndebug=false\n' >"/tmp/new-handler.dat"&&sed -n "s/^user=//p" "/tmp/new-handler.dat"; true ; } > /tmp/mill2/20240327
            echo "integrity: $(sha256sum /tmp/mill2/20240327 | cut -c1-20)"
      - persist_to_workspace:
          root: /tmp/mill2
          paths:
            - '20240327'
